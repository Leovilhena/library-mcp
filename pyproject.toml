[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "library-mcp"
description = "A specialized library-keeper agent: ingest PDF/EPUB books, answer questions grounded in them via local embedding search."
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
keywords = ["mcp", "rag", "embeddings", "llm", "agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  # Upper-bounded deliberately: mcp 2.0.0 (released mid-session, 2026-07-28)
  # restructured the package and removed mcp.server.fastmcp entirely, which
  # both servers import directly -- an unpinned floor-only constraint let
  # one image build against 1.28.1 and a later rebuild of the other pull
  # 2.0.0 and break at import time. Revisit the mcp 2.x migration
  # deliberately, in its own pass, not as a silent side effect of a rebuild.
  "mcp>=1.28.1,<2.0.0",
  "pydantic>=2.13.4",
  "PyYAML>=6.0.3",
  "httpx>=0.28.1",
  "pypdf>=5.1.0",
  "ebooklib>=0.18",
  # General web search fallback (DdgsSource, external_sources.py) -- no API
  # key, free. Only ever invoked in a subprocess worker
  # (_ddgs_worker.py), never imported/called directly in-process: its
  # underlying native HTTP client can block while holding the GIL, so a
  # thread-pool timeout cannot reliably cancel a hang (see
  # hermes-agent's plugins/web/ddgs/provider.py for the incident this
  # defends against).
  "ddgs>=9.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "ruff>=0.16.0",
  "mypy>=2.3.0",
  "bandit>=1.9.4",
  "pip-audit>=2.10.1",
  "types-PyYAML>=6.0.12.20260724",
  # Only used to generate real PDF fixtures for tests (conftest.py) --
  # never imported by the shipped package itself.
  "reportlab>=4.0",
]

[project.scripts]
library-parse-server = "library_mcp.servers.parse_server:main"
library-keeper-server = "library_mcp.servers.keeper_server:main"

[tool.setuptools.dynamic]
version = { attr = "library_mcp.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle / pyflakes
  "I",                # import sorting
  "N",                # naming
  "UP",               # pyupgrade
  "S",                # flake8-bandit (security)
  "B",                # bugbear
  "A",                # builtin shadowing
  "C4",               # comprehensions
  "PT",               # pytest style
  "RET",              # return simplification
  "SIM",              # simplification
  "ARG",              # unused arguments
  "PTH",              # prefer pathlib
  "PL",               # pylint subset
  "RUF",
]
ignore = [
  "PLR0913",  # many args is fine for the store's plain functions (matches sandbox-mcp)
  "PLR0917",
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately assert and construct raw SQL fixtures/magic numbers.
"tests/**" = ["S101", "S608", "PLR2004", "PLC0415"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["library_mcp"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ebooklib ships no py.typed marker/stubs.
[[tool.mypy.overrides]]
module = "ebooklib.*"
ignore_missing_imports = true

[tool.bandit]
# Same reasoning as sandbox-mcp: tests intentionally construct hostile-shaped
# inputs and use assert.
exclude_dirs = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "network: hits a real external API (Wikipedia/Wikiquote) -- safe, free, no key, but requires internet access; skip with -m 'not network' offline.",
]
